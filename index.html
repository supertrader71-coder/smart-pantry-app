<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Pantry Pro - Protetto</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #007bff; --success: #28a745; --danger: #ff3b30; --warning: #ffcc00; --text: #ffffff; --freezer: #00a2ff; }
        
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* SCHERMATA DI PROTEZIONE CON PASSWORD */
        #password-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .lock-icon { font-size: 50px; margin-bottom: 20px; }
        .lock-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        #pin-input { background: #222; border: 2px solid #444; padding: 15px; border-radius: 12px; color: #fff; font-size: 24px; text-align: center; width: 100%; max-width: 200px; letter-spacing: 5px; outline: none; margin-bottom: 15px; }
        #pin-input:focus { border-color: var(--primary); }
        .btn-unlock { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .error-msg { color: var(--danger); font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }

        /* SCHERMATA HUB INIZIALE */
        #hub-screen { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100vh; gap: 20px; padding: 20px; box-sizing: border-box; }
        .hub-title { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 5px; }
        .hub-subtitle { font-size: 14px; color: #aaa; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .hub-btn { width: 100%; max-width: 300px; padding: 35px 20px; border-radius: 24px; border: none; font-size: 18px; font-weight: bold; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        #btn-choose-frigo { background: linear-gradient(135deg, #2c3e50, #2980b9); }
        #btn-choose-freezer { background: linear-gradient(135deg, #1f4068, var(--freezer)); }
        .hub-btn span { font-size: 12px; font-weight: normal; opacity: 0.8; }

        /* SCHERMATA OPERATIVA */
        #app-screen { display: none; flex-direction: column; height: 100vh; width: 100%; overflow: hidden; }
        .nav-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 12px; background: var(--card); border-bottom: 1px solid #333; height: 50px; box-sizing: border-box; flex-shrink: 0; }
        .btn-back { background: #333; border: none; color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        .nav-title { font-size: 15px; font-weight: bold; }

        /* Fotocamera ed OCR */
        #camera-wrapper { position: relative; width: 100%; height: 22vh; background: #000; flex-shrink: 0; display: none; justify-content: center; align-items: center; border-bottom: 1px solid #333; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .viewfinder { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; height: 35%; border: 3px solid var(--success); border-radius: 12px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6); z-index: 5; }
        .label-overlay { position: absolute; top: -30px; left: 0; background: var(--success); color: #000; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; }
        #camera-placeholder { color: #888; text-align: center; cursor: pointer; padding: 10px; font-weight: bold; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1a1a; }

        /* Controlli e Liste */
        .controls { padding: 12px; background: var(--card); border-bottom: 1px solid #333; flex-shrink: 0; box-sizing: border-box; }
        .btn-main { background: #fff; color: #000; border: none; padding: 12px; border-radius: 30px; font-weight: bold; width: 100%; margin-bottom: 8px; font-size: 14px; display: none; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-manual { flex: 1; background: #333; color: #fff; border: 1px solid #444; padding: 11px; border-radius: 30px; font-size: 13px; font-weight: bold; }
        .btn-voice { flex: 1; background: var(--primary); color: #fff; border: 1px solid #0056b3; padding: 11px; border-radius: 30px; font-size: 13px; font-weight: bold; }
        #search-bar { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; box-sizing: border-box; }
        
        .inventory { flex-grow: 1; overflow-y: auto; padding: 12px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
        .product-card { background: var(--card); margin-bottom: 10px; padding: 14px 12px; border-radius: 12px; display: flex; align-items: center; border-left: 5px solid var(--primary); gap: 10px; }
        .product-info { flex: 1; min-width: 0; }
        .product-info b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .product-info span { font-size: 12px; color: #aaa; }
        
        .qty-controls { display: flex; align-items: center; gap: 8px; background: #2a2a2a; padding: 5px 10px; border-radius: 20px; flex-shrink: 0; }
        .qty-controls button { background: #444; border: none; color: white; width: 26px; height: 26px; border-radius: 50%; font-weight: bold; font-size: 16px; }
        .qty-val { min-width: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        .actions { display: flex; gap: 5px; flex-shrink: 0; }
        .actions button { background: transparent; border: none; font-size: 20px; padding: 5px; cursor: pointer; }
        .btn-delete { color: var(--danger); }

        /* Modale */
        #manual-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 85%; max-width: 350px; box-sizing: border-box; }
        .modal-content input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; box-sizing: border-box; font-size: 16px; }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div id="password-screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Accesso Riservato Dispensa</div>
        <input type="password" id="pin-input" placeholder="••••" inputmode="numeric" maxlength="6">
        <button class="btn-unlock" onclick="checkPassword()">SBLOCCA</button>
        <div class="error-msg" id="error-message">Codice errato. Riprova.</div>
    </div>

    <div id="hub-screen">
        <div class="hub-title">Dispensa Privata</div>
        <div class="hub-subtitle">Scegli reparto</div>
        <button id="btn-choose-frigo" class="hub-btn" onclick="switchZone('frigo')">
            🧊 REPARTO FRIGO
            <span>Monitoraggio scadenze (Con Data)</span>
        </button>
        <button id="btn-choose-freezer" class="hub-btn" onclick="switchZone('freezer')">
            ❄️ REPARTO FREEZER
            <span>Scorte a lungo termine (No Data)</span>
        </button>
    </div>

    <div id="app-screen">
        <div class="nav-header">
            <button class="btn-back" onclick="goToHub()">⬅️ Reparti</button>
            <div class="nav-title" id="current-zone-title">Ambiente</div>
            <div style="width:65px"></div>
        </div>

        <div id="camera-wrapper">
            <div id="camera-placeholder" onclick="startCamera()"><span>📸 Attiva Fotocamera OCR</span></div>
            <video id="video" autoplay playsinline></video>
            <div class="viewfinder" id="viewfinder"><div id="step-label" class="label-overlay">1. NOME PRODOTTO</div></div>
        </div>

        <div class="controls">
            <button id="capture-btn" class="btn-main">📸 SCANSIONA TESTO VIA OCR</button>
            <div class="btn-row">
                <button onclick="openManualModal()" class="btn-manual">⌨️ INSERISCI MANUALMENTE</button>
                <button onclick="startVoiceRecognition()" class="btn-voice">🎙️ DETTA A VOCE</button>
            </div>
            <input type="text" id="search-bar" placeholder="🔍 Cerca prodotto...">
        </div>

        <div class="inventory" id="inventory-list"></div>
    </div>

    <div id="manual-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="font-size:16px; text-align:center; margin-bottom:15px; margin-top:0;">Nuovo Prodotto</h2>
            <input type="text" id="man-name" placeholder="Nome Prodotto" autocomplete="off">
            <input type="text" id="man-date" placeholder="Scadenza (GG.MM.AAAA)" inputmode="numeric" maxlength="10">
            
            <div style="display:flex; align-items:center; justify-content:space-between; margin: 10px 0;">
                <span>Quantità:</span>
                <input type="number" id="man-qty" value="1" style="width: 70px; margin:0; text-align:center;">
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="closeManualModal()" style="flex:1; padding:12px; border-radius:10px; border:none; background:#444; color:white;">Annulla</button>
                <button onclick="saveManual()" style="flex:2; padding:12px; border-radius:10px; border:none; background:var(--success); color:white; font-weight:bold;">Conferma</button>
            </div>
        </div>
    </div>

    <canvas id="crop-canvas"></canvas>

    <script>
        // CONFIGURAZIONE PASSWORD DI SICUREZZA
        const APP_PASSWORD = "1234"; 

        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const inventoryList = document.getElementById('inventory-list');
        const searchBar = document.getElementById('search-bar');
        const canvas = document.getElementById('crop-canvas');
        const stepLabel = document.getElementById('step-label');
        const viewfinder = document.getElementById('viewfinder');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        
        let currentZone = 'frigo';
        let currentStep = 'name';
        let tempProduct = { name: '', date: '', qty: 1 };
        let editingId = null;
        let db;
        let streamInstance = null;

        // --- CONTROLLO PASSWORD DI SICUREZZA ALL'AVVIO ---
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('pantry_unlocked') === 'true') {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('hub-screen').style.display = 'flex';
            }
        });

        function checkPassword() {
            const inputVal = document.getElementById('pin-input').value;
            if (inputVal === APP_PASSWORD) {
                sessionStorage.setItem('pantry_unlocked', 'true');
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('hub-screen').style.display = 'flex';
            } else {
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('pin-input').value = "";
            }
        }

        document.getElementById('pin-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });


        // --- CARICAMENTO E AUTO-RECUPERO DATI (STRUTTURA AGGIORNATA PER EVITARE PERDITE) ---
        // Aumentando la versione a 5, forziamo il browser a riallineare i vecchi file persi
        const request = indexedDB.open("PantryDB", 5);
        
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("products")) {
                db.createObjectStore("products", { keyPath: "id", autoIncrement: true });
            }
        };
        
        request.onsuccess = (e) => { 
            db = e.target.result; 
            recuperaEValeVecchiDati(); // Esegue il salvataggio automatico se necessario
        };

        // Funzione scudo: controlla se ci sono prodotti non formattati correttamente e li aggiusta
        function recuperaEValeVecchiDati() {
            const tx = db.transaction("products", "readwrite");
            const store = tx.objectStore("products");
            
            store.openCursor().onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    const item = cursor.value;
                    let aggiornato = false;
                    
                    // Se un vecchio prodotto non ha la zona specificata, di default era Frigo
                    if (!item.zone) {
                        item.zone = 'frigo';
                        aggiornato = true;
                    }
                    
                    if (aggiornato) {
                        store.put(item);
                    }
                    cursor.continue();
                }
            };
        }

        // --- LOGICA CAMBIO REPARTO ---
        function switchZone(zone) {
            currentZone = zone;
            document.getElementById('hub-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            searchBar.value = "";
            
            if (zone === 'freezer') {
                document.getElementById('current-zone-title').innerText = "❄️ REPARTO FREEZER";
                document.getElementById('camera-wrapper').style.display = 'none';
                document.getElementById('man-date').style.display = 'none';
            } else {
                document.getElementById('current-zone-title').innerText = "🧊 REPARTO FRIGO";
                document.getElementById('camera-wrapper').style.display = 'flex';
                document.getElementById('man-date').style.display = 'block';
                resetCameraWrapper();
            }
            displayProducts();
        }

        function goToHub() {
            stopCameraStream();
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('hub-screen').style.display = 'flex';
        }

        function resetCameraWrapper() {
            video.style.display = 'none';
            viewfinder.style.display = 'none';
            captureBtn.style.display = 'none';
            cameraPlaceholder.style.display = 'flex';
            currentStep = 'name';
            updateUI('name');
        }

        function stopCameraStream() {
            if (streamInstance) {
                streamInstance.getTracks().forEach(track => track.stop());
                streamInstance = null;
            }
        }

        // --- CAMERA ED OCR ---
        async function startCamera() {
            try {
                streamInstance = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = streamInstance;
                video.style.display = 'block';
                viewfinder.style.display = 'block';
                captureBtn.style.display = 'block';
                cameraPlaceholder.style.display = 'none';
            } catch (err) { alert("Impossibile accedere alla fotocamera."); }
        }

        captureBtn.addEventListener('click', async () => {
            if(!streamInstance) return;
            const ctx = canvas.getContext('2d');
            const vW = video.videoWidth; const vH = video.videoHeight;
            const cW = vW * 0.75; const cH = vH * 0.35;
            const sX = (vW - cW) / 2; const sY = (vH - cH) / 2;
            canvas.width = cW; canvas.height = cH;
            ctx.drawImage(video, sX, sY, cW, cH, 0, 0, cW, cH);
            
            try {
                const result = await Tesseract.recognize(canvas, 'ita');
                let text = result.data.text.trim();
                if (currentStep === 'name') {
                    tempProduct.name = text.replace(/\n/g, " ") || "Sconosciuto";
                    currentStep = 'date'; updateUI('date');
                } else {
                    const datePattern = /\b(\d{1,2})([./-])(\d{1,2})\2(\d{2,4})\b/;
                    const foundDate = text.match(datePattern);
                    tempProduct.date = foundDate ? foundDate[0].replace(/\s/g, "") : "";
                    openManualModal(tempProduct.name, tempProduct.date, 1);
                    resetCameraWrapper();
                }
            } catch (e) { alert("Errore OCR."); }
        });

        // --- SISTEMA VOCALE ---
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Riconoscimento vocale non supportato."); return; }

            const recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;

            const originalPlaceholder = searchBar.placeholder;
            searchBar.placeholder = "🎙️ Sto ascoltando... Parla ora!";
            searchBar.style.background = "#0c2340";
            recognition.start();

            recognition.onresult = (event) => {
                searchBar.placeholder = originalPlaceholder;
                searchBar.style.background = "#2a2a2a";
                let speechToText = event.results[0][0].transcript.toLowerCase().trim();
                
                let qtyRilevata = 1;
                const paroleNumeri = { "una": 1, "uno": 1, "due": 2, "tre": 3, "quattro": 4, "cinque": 5, "sei": 6, "sette": 7, "otto": 8, "nove": 9, "dieci": 10 };

                let parole = speechToText.split(" ");
                let primaParola = parole[0];

                if (paroleNumeri[primaParola]) {
                    qtyRilevata = paroleNumeri[primaParola];
                    speechToText = parole.slice(1).join(" ");
                } else if (!isNaN(parseInt(primaParola))) {
                    qtyRilevata = parseInt(primaParola);
                    speechToText = parole.slice(1).join(" ");
                }

                speechToText = speechToText.replace(/^(confezioni|confezione|scatole|scatola|barattoli|barattolo|pacchi|pacco|pezzi|pezzo|bottiglie|bottiglia)\s+(di\s+)?/i, "").trim();

                if (currentZone === 'freezer') {
                    openManualModal(capitalize(speechToText), "", qtyRilevata);
                    return;
                }

                let triggerWord = "scadenza";
                if (!speechToText.includes(triggerWord)) triggerWord = "scade";
                
                if (speechToText.includes(triggerWord)) {
                    const parti = speechToText.split(triggerWord);
                    let nomeProdotto = parti[0].replace(/\b(il|del)\b/g, "").trim();
                    const dataFormattata = analizzaDataVocale(parti[1].trim());
                    openManualModal(capitalize(nomeProdotto), dataFormattata, qtyRilevata);
                } else {
                    openManualModal(capitalize(speechToText), "", qtyRilevata);
                }
            };
            
            recognition.onerror = () => {
                searchBar.placeholder = originalPlaceholder;
                searchBar.style.background = "#2a2a2a";
            };
        }

        function analizzaDataVocale(testo) {
            const mesi = { "gennaio":"01", "febbraio":"02", "marzo":"03", "aprile":"04", "maggio":"05", "giugno":"06", "luglio":"07", "agosto":"08", "settembre":"09", "ottobre":"10", "novembre":"11", "dicembre":"12" };
            let testoPulito = testo.replace(/\b(il|del|di|anno|venti)\b/g, "").trim();
            testoPulito = testoPulito.replace(/ventisei/g, "26").replace(/ventisette/g, "27").replace(/ventotto/g, "28");

            for (let mese in mesi) {
                if (testoPulito.includes(mese)) {
                    let parti = testoPulito.split(mese);
                    let giorno = parti[0].replace(/\D/g, '').trim().padStart(2, '0');
                    let frammentoAnno = parti[1].replace(/\D/g, '').trim();
                    let anno = new Date().getFullYear(); 
                    if (frammentoAnno) anno = frammentoAnno.length === 2 ? "20" + frammentoAnno : frammentoAnno;
                    return `${giorno}.${mesi[mese]}.${anno}`;
                }
            }
            let cifre = testoPulito.match(/\d+/g);
            if (cifre && cifre.length >= 2) {
                let g = cifre[0].padStart(2, '0'); let m = cifre[1].padStart(2, '0');
                let a = cifre[2] || new Date().getFullYear();
                if (a.toString().length === 2) a = "20" + a;
                return `${g}.${m}.${a}`;
            }
            return "";
        }

        // --- GESTIONE MODAL E SALVATAGGIO ---
        function openManualModal(name = "", date = "", qty = 1, id = null) {
            editingId = id;
            document.getElementById('modal-title').innerText = id ? "Modifica Prodotto" : "Nuovo Prodotto";
            document.getElementById('man-name').value = name;
            document.getElementById('man-date').value = date;
            document.getElementById('man-qty').value = qty;
            document.getElementById('manual-modal').style.display = 'flex';
        }

        function closeManualModal() { 
            document.getElementById('manual-modal').style.display = 'none'; 
            editingId = null; 
            resetCameraWrapper(); 
        }

        function saveManual() {
            const p = {
                name: document.getElementById('man-name').value || "Senza nome",
                date: currentZone === 'freezer' ? "" : (document.getElementById('man-date').value || "16.05.2026"),
                qty: parseInt(document.getElementById('man-qty').value) || 1,
                zone: currentZone
            };
            if (editingId) p.id = editingId;
            const tx = db.transaction("products", "readwrite");
            tx.objectStore("products").put(p);
            tx.oncomplete = () => { 
                closeManualModal(); 
                displayProducts(); 
            };
        }

        document.getElementById('man-date').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 2 && v.length <= 4) v = v.slice(0,2) + '.' + v.slice(2);
            else if (v.length > 4) v = v.slice(0,2) + '.' + v.slice(2,4) + '.' + v.slice(4,8);
            e.target.value = v;
        });

        function changeQty(id, delta) {
            const store = db.transaction("products", "readwrite").objectStore("products");
            store.get(id).onsuccess = (e) => {
                const p = e.target.result; p.qty = (p.qty || 1) + delta; if (p.qty < 1) p.qty = 1;
                store.put(p).onsuccess = () => displayProducts(searchBar.value);
            };
        }

        function deleteProduct(id) {
            if (confirm("Vuoi rimuovere l'elemento?")) {
                const tx = db.transaction("products", "readwrite");
                tx.objectStore("products").delete(id);
                tx.oncomplete = () => displayProducts(searchBar.value);
            }
        }

        // --- RENDERING DELLA LISTA ---
        function displayProducts(filter = "") {
            inventoryList.innerHTML = "";
            if(!db) return;
            const store = db.transaction("products").objectStore("products");
            const all = [];
            
            store.openCursor().onsuccess = (e) => {
                const c = e.target.result;
                if (c) {
                    const matchesSearch = c.value.name.toLowerCase().includes(filter.toLowerCase());
                    const productZone = c.value.zone || 'frigo';
                    
                    if (matchesSearch && productZone === currentZone) {
                        all.push(c.value);
                    }
                    c.continue();
                } else {
                    if (currentZone === 'freezer') {
                        all.sort((a,b) => a.name.localeCompare(b.name));
                    } else {
                        all.sort((a,b) => parseDate(a.date) - parseDate(b.date));
                    }
                    
                    all.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        
                        if (currentZone === 'freezer') {
                            card.style.borderLeftColor = "var(--freezer)";
                            card.innerHTML = `
                                <div class="product-info"><b>${p.name}</b><span>❄️ Freezer</span></div>
                                <div class="qty-controls">
                                    <button onclick="changeQty(${p.id}, -1)">-</button>
                                    <span class="qty-val">${p.qty || 1}</span>
                                    <button onclick="changeQty(${p.id}, 1)">+</button>
                                </div>
                                <div class="actions">
                                    <button class="btn-edit" onclick="openManualModal('${p.name.replace(/'/g, "\\'")}', '', ${p.qty || 1}, ${p.id})">✎</button>
                                    <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑</button>
                                </div>`;
                        } else {
                            const d = Math.ceil((parseDate(p.date) - new Date().setHours(0,0,0,0)) / 86400000);
                            card.style.borderLeftColor = d < 0 ? "#444" : (d <= 3 ? "var(--danger)" : (d <= 7 ? "var(--warning)" : "var(--success)"));
                            card.innerHTML = `
                                <div class="product-info"><b>${p.name}</b><span>Scadenza: ${p.date} ${d < 0 ? '❌' : ''}</span></div>
                                <div class="qty-controls">
                                    <button onclick="changeQty(${p.id}, -1)">-</button>
                                    <span class="qty-val">${p.qty || 1}</span>
                                    <button onclick="changeQty(${p.id}, 1)">+</button>
                                </div>
                                <div class="actions">
                                    <button class="btn-edit" onclick="openManualModal('${p.name.replace(/'/g, "\\'")}', '${p.date}', ${p.qty || 1}, ${p.id})">✎</button>
                                    <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑</button>
                                </div>`;
                        }
                        inventoryList.appendChild(card);
                    });
                }
            };
        }

        function parseDate(s) {
            const p = s.split(/[./-]/); if (p.length !== 3) return new Date(2100,0,1);
            let y = parseInt(p[2]); if (y < 100) y += 2000;
            return new Date(y, parseInt(p[1])-1, parseInt(p[0]));
        }

        searchBar.addEventListener('input', () => displayProducts(searchBar.value));
        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
        function updateUI(s) { const isD = s === 'date'; viewfinder.style.borderColor = isD ? "var(--danger)" : "var(--success)"; stepLabel.innerText = isD ? "2. DATA DI SCADENZA" : "1. NOME PRODOTTO"; stepLabel.style.background = isD ? "var(--danger)" : "var(--success)"; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Pantry Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #007bff; --success: #28a745; --danger: #ff3b30; --warning: #ffcc00; --text: #ffffff; }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Area Fotocamera Gestita */
        #camera-wrapper { position: relative; width: 100%; height: 25vh; background: #000; flex-shrink: 0; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .viewfinder { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; height: 35%; border: 3px solid var(--success); border-radius: 12px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6); z-index: 5; }
        .label-overlay { position: absolute; top: -30px; left: 0; background: var(--success); color: #000; padding: 4px 10px; font-size: 11px; font-weight: bold; border-radius: 4px; }
        #camera-placeholder { color: #888; text-align: center; cursor: pointer; padding: 20px; font-weight: bold; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1a1a; }

        /* Controlli */
        .controls { padding: 12px; background: var(--card); border-bottom: 1px solid #333; z-index: 10; }
        .btn-main { background: #fff; color: #000; border: none; padding: 12px; border-radius: 30px; font-weight: bold; width: 100%; margin-bottom: 8px; font-size: 15px; display: none; }
        .btn-manual { background: #333; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 30px; width: 100%; margin-bottom: 10px; font-size: 14px; }
        #search-bar { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; box-sizing: border-box; }
        
        /* Modal */
        #manual-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 20px; width: 85%; max-width: 350px; }
        .modal-content input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; box-sizing: border-box; font-size: 16px; }
        
        /* Lista Inventario */
        .inventory { flex-grow: 1; overflow-y: auto; padding: 12px; }
        .product-card { background: var(--card); margin-bottom: 10px; padding: 12px; border-radius: 12px; display: flex; align-items: center; border-left: 5px solid var(--primary); gap: 10px; }
        .product-info { flex: 1; min-width: 0; }
        .product-info b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .product-info span { font-size: 12px; color: #aaa; }
        
        /* Quantità e Azioni */
        .qty-controls { display: flex; align-items: center; gap: 8px; background: #2a2a2a; padding: 5px 10px; border-radius: 20px; }
        .qty-controls button { background: #444; border: none; color: white; width: 26px; height: 26px; border-radius: 50%; font-weight: bold; }
        .qty-val { min-width: 15px; text-align: center; font-weight: bold; font-size: 14px; }
        
        .actions { display: flex; gap: 5px; }
        .actions button { background: transparent; border: none; font-size: 20px; padding: 5px; cursor: pointer; }
        .btn-edit { color: #888; }
        .btn-delete { color: var(--danger); }

        canvas { display: none; }
    </style>
</head>
<body>

    <div id="camera-wrapper">
        <div id="camera-placeholder" onclick="startCamera()">
            <span>📸 Tocca qui per attivare la fotocamera</span>
            <small style="font-size:11px; color:#666; margin-top:5px;">Necessario solo per scansione OCR</small>
        </div>
        <video id="video" autoplay playsinline></video>
        <div class="viewfinder" id="viewfinder"><div id="step-label" class="label-overlay">1. NOME PRODOTTO</div></div>
    </div>

    <div class="controls">
        <button id="capture-btn" class="btn-main">📸 SCANSIONA TESTO</button>
        <button onclick="openManualModal()" class="btn-manual">⌨️ INSERIMENTO MANUALE</button>
        <input type="text" id="search-bar" placeholder="🔍 Cerca prodotto...">
    </div>

    <div class="inventory" id="inventory-list"></div>

    <div id="manual-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="font-size:16px; text-align:center; margin-bottom:15px;">Nuovo Prodotto</h2>
            <input type="text" id="man-name" placeholder="Nome Prodotto" autocomplete="off">
            <input type="text" id="man-date" placeholder="Scadenza (GG.MM.AAAA)" inputmode="numeric" maxlength="10">
            <div style="display:flex; align-items:center; justify-content:space-between; margin: 10px 0;">
                <span>Quantità:</span>
                <input type="number" id="man-qty" value="1" style="width: 70px; margin:0; text-align:center;">
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="closeManualModal()" style="flex:1; padding:12px; border-radius:10px; border:none; background:#444; color:white;">Annulla</button>
                <button onclick="saveManual()" style="flex:2; padding:12px; border-radius:10px; border:none; background:var(--success); color:white; font-weight:bold;">Conferma</button>
            </div>
        </div>
    </div>

    <canvas id="crop-canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const inventoryList = document.getElementById('inventory-list');
        const searchBar = document.getElementById('search-bar');
        const canvas = document.getElementById('crop-canvas');
        const stepLabel = document.getElementById('step-label');
        const viewfinder = document.getElementById('viewfinder');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        
        let currentStep = 'name';
        let tempProduct = { name: '', date: '', qty: 1 };
        let editingId = null;
        let db;
        let streamInstance = null;

        // --- DATABASE INDEXED DB ---
        const request = indexedDB.open("PantryDB", 2);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("products")) {
                db.createObjectStore("products", { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = (e) => { 
            db = e.target.result; 
            displayProducts(); // Carica subito i prodotti all'avvio dell'app
        };

        // --- FUNZIONE ATTIVAZIONE TELECAMERA A COMANDO ---
        async function startCamera() {
            try {
                streamInstance = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = streamInstance;
                
                // Mostra elementi grafici fotocamera e nascondi il segnaposto
                video.style.display = 'block';
                viewfinder.style.display = 'block';
                captureBtn.style.display = 'block';
                cameraPlaceholder.style.display = 'none';
            } catch (err) {
                alert("Impossibile accedere alla fotocamera. Controlla i permessi.");
            }
        }

        // --- ACCETTAZIONE OCR SCAN ---
        captureBtn.addEventListener('click', async () => {
            if(!streamInstance) return;
            const ctx = canvas.getContext('2d');
            const vW = video.videoWidth; const vH = video.videoHeight;
            const cW = vW * 0.75; const cH = vH * 0.35;
            const sX = (vW - cW) / 2; const sY = (vH - cH) / 2;
            canvas.width = cW; canvas.height = cH;
            ctx.drawImage(video, sX, sY, cW, cH, 0, 0, cW, cH);
            
            try {
                const result = await Tesseract.recognize(canvas, 'ita');
                let text = result.data.text.trim();
                if (currentStep === 'name') {
                    tempProduct.name = text.replace(/\n/g, " ") || "Sconosciuto";
                    currentStep = 'date'; updateUI('date');
                } else {
                    const datePattern = /\b(\d{1,2})([./-])(\d{1,2})\2(\d{2,4})\b/;
                    const foundDate = text.match(datePattern);
                    tempProduct.date = foundDate ? foundDate[0].replace(/\s/g, "") : "";
                    openManualModal(tempProduct.name, tempProduct.date);
                    resetFlow();
                }
            } catch (e) { alert("Errore lettura testo."); }
        });

        function openManualModal(name = "", date = "", qty = 1, id = null) {
            editingId = id;
            document.getElementById('modal-title').innerText = id ? "Modifica Prodotto" : "Nuovo Prodotto";
            document.getElementById('man-name').value = name;
            document.getElementById('man-date').value = date;
            document.getElementById('man-qty').value = qty;
            document.getElementById('manual-modal').style.display = 'flex';
        }

        function closeManualModal() { document.getElementById('manual-modal').style.display = 'none'; editingId = null; }

        function saveManual() {
            const p = {
                name: document.getElementById('man-name').value || "Senza nome",
                date: document.getElementById('man-date').value || "00.00.0000",
                qty: parseInt(document.getElementById('man-qty').value) || 1
            };
            if (editingId) p.id = editingId;
            const tx = db.transaction("products", "readwrite");
            tx.objectStore("products").put(p);
            tx.oncomplete = () => { closeManualModal(); displayProducts(); };
        }

        document.getElementById('man-date').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 2 && v.length <= 4) v = v.slice(0,2) + '.' + v.slice(2);
            else if (v.length > 4) v = v.slice(0,2) + '.' + v.slice(2,4) + '.' + v.slice(4,8);
            e.target.value = v;
        });

        function changeQty(id, delta) {
            const store = db.transaction("products", "readwrite").objectStore("products");
            store.get(id).onsuccess = (e) => {
                const p = e.target.result;
                p.qty = (p.qty || 1) + delta;
                if (p.qty < 1) p.qty = 1; 
                store.put(p).onsuccess = () => displayProducts();
            };
        }

        function deleteProduct(id) {
            if (confirm("Vuoi eliminare definitivamente questo prodotto?")) {
                const tx = db.transaction("products", "readwrite");
                tx.objectStore("products").delete(id);
                tx.oncomplete = () => displayProducts();
            }
        }

        // --- LOGICA DI ORDINAMENTO DAL PIU VICINO AL PIU LONTANO ---
        function displayProducts(filter = "") {
            inventoryList.innerHTML = "";
            const store = db.transaction("products").objectStore("products");
            const all = [];
            store.openCursor().onsuccess = (e) => {
                const c = e.target.result;
                if (c) { 
                    if (c.value.name.toLowerCase().includes(filter.toLowerCase())) all.push(c.value); 
                    c.continue(); 
                } else {
                    // Ordina rigorosamente dal prodotto con scadenza più imminente (a) a quello più lontano (b)
                    all.sort((a,b) => parseDate(a.date) - parseDate(b.date));
                    
                    all.forEach(p => {
                        const d = Math.ceil((parseDate(p.date) - new Date().setHours(0,0,0,0)) / 86400000);
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.style.borderLeftColor = d < 0 ? "#444" : (d <= 3 ? "var(--danger)" : (d <= 7 ? "var(--warning)" : "var(--success)"));
                        card.innerHTML = `
                            <div class="product-info"><b>${p.name}</b><span>Scadenza: ${p.date} ${d < 0 ? '❌ (Scaduto)' : ''}</span></div>
                            <div class="qty-controls">
                                <button onclick="changeQty(${p.id}, -1)">-</button>
                                <span class="qty-val">${p.qty || 1}</span>
                                <button onclick="changeQty(${p.id}, 1)">+</button>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openManualModal('${p.name.replace(/'/g, "\\'")}', '${p.date}', ${p.qty || 1}, ${p.id})">✎</button>
                                <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑</button>
                            </div>`;
                        inventoryList.appendChild(card);
                    });
                }
            };
        }

        function parseDate(s) {
            const p = s.split(/[./-]/);
            if (p.length !== 3) return new Date(2100,0,1); // Manda in fondo le date non valide
            let y = parseInt(p[2]); if (y < 100) y += 2000;
            return new Date(y, parseInt(p[1])-1, parseInt(p[0]));
        }

        searchBar.addEventListener('input', () => displayProducts(searchBar.value));
        function updateUI(s) { const isD = s === 'date'; viewfinder.style.borderColor = isD ? "var(--danger)" : "var(--success)"; stepLabel.innerText = isD ? "2. DATA DI SCADENZA" : "1. NOME PRODOTTO"; stepLabel.style.background = isD ? "var(--danger)" : "var(--success)"; }
        function resetFlow() { currentStep = 'name'; updateUI('name'); }
    </script>
</body>
</html>

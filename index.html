<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - Scansione Data</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        /* Contenitore della fotocamera con mirino */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            background: black;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        /* Il mirino visivo (rettangolo rosso) */
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;  /* Larghezza del mirino */
            height: 30%; /* Altezza del mirino */
            border: 4px solid #ff3b30; /* Colore rosso Apple */
            border-radius: 10px;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); /* Scurisce l'esterno */
            z-index: 10;
            pointer-events: none; /* Non blocca i tocchi */
        }
        
        #preview { width: 100%; display: block; }
        
        /* Pulsanti e Output */
        .controls { margin-top: 20px; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button:active { background: #0056b3; }
        #output { margin-top: 20px; padding: 15px; background: white; border-radius: 10px; min-height: 60px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .data-found { color: #28a745; font-weight: bold; font-size: 1.2em; }
        .data-not-found { color: #dc3545; }
    </style>
</head>
<body>

    <h1>🍎 Smart Pantry</h1>
    <p class="subtitle">Allinea la data di scadenza nel rettangolo rosso</p>

    <div class="camera-container">
        <div class="viewfinder"></div>
        <img id="preview" src="https://via.placeholder.com/400x300.png?text=Carica+Foto" alt="Anteprima">
    </div>

    <div class="controls">
        <input type="file" accept="image/*" capture="environment" id="file-input" style="display: none;">
        <button onclick="document.getElementById('file-input').click()">📸 Scansiona Data</button>
    </div>

    <div id="output">Il risultato apparirà qui...</div>

    <canvas id="crop-canvas" style="display:none;"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const output = document.getElementById('output');
        const preview = document.getElementById('preview');
        const cropCanvas = document.getElementById('crop-canvas');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            output.innerHTML = "<em>Elaborazione immagine...</em>";
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Mostra l'immagine intera nell'anteprima
                    preview.src = event.target.result;
                    
                    // RITAGLIO DELL'IMMAGINE: analizziamo solo l'area del mirino
                    const ctx = cropCanvas.getContext('2d');
                    
                    // Definiamo l'area di ritaglio (corrispondente al mirino CSS)
                    const cropWidth = img.width * 0.7;  // 70% della larghezza
                    const cropHeight = img.height * 0.3; // 30% dell'altezza
                    const startX = (img.width - cropWidth) / 2;
                    const startY = (img.height - cropHeight) / 2;

                    cropCanvas.width = cropWidth;
                    cropCanvas.height = cropHeight;

                    // Disegna solo la parte ritagliata sul canvas nascosto
                    ctx.drawImage(img, startX, startY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                    
                    // Avvia l'OCR sul ritaglio
                    startOCR(cropCanvas);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function startOCR(canvasToScan) {
            output.innerHTML = "<em>Lettura data in corso (Tesseract.js)...</em>";
            
            try {
                const result = await Tesseract.recognize(
                    canvasToScan,
                    'ita', // Lingua italiana
                    { logger: m => console.log(m.status + ": " + Math.round(m.progress * 100) + "%") }
                );
                
                const text = result.data.text;
                console.log("Testo estratto dal mirino:", text);

                // REGEX POTENZIATA: Trova GG/MM/AAAA, GG-MM-AAAA, GG.MM.AAAA (e anni a 2 cifre)
                // Il pattern cerca: 2 cifre + (punto o barra o trattino) + 2 cifre + (stesso separatore) + 2 o 4 cifre
                const datePattern = /\b(\d{1,2})([./-])(\d{1,2})\2(\d{2,4})\b/;
                
                // Puliamo il testo da spazi bianchi eccessivi prima della ricerca
                const cleanText = text.replace(/\s+/g, ' ');
                const foundDate = cleanText.match(datePattern);
                
                if (foundDate) {
                    output.innerHTML = `
                        <span class="data-found">Data Scadenza Rilevata:</span><br>
                        <span style="font-size:1.5em; font-weight:bold;">${foundDate[0]}</span>
                    `;
                } else {
                    output.innerHTML = `
                        <span class="data-not-found">Data non trovata.</span><br>
                        <span style="font-size:0.9em; color:#666;">Il testo letto era: "${text.substring(0, 30)}..."<br>Riprova allineando meglio la data.</span>
                    `;
                }

            } catch (err) {
                output.innerText = "Errore durante la lettura OCR.";
                console.error(err);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Pantry Live OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; text-align: center; }
        
        /* Contenitore Video a tutto schermo */
        #camera-wrapper {
            position: relative;
            width: 100vw;
            height: 70vh;
            background: #222;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Il Mirino Fisso */
        .viewfinder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 25%;
            border: 3px solid #00ff00; /* Verde per il mirino attivo */
            border-radius: 12px;
            box-shadow: 0 0 0 500px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .label-overlay {
            position: absolute;
            top: -35px; left: 0;
            background: #00ff00; color: black;
            padding: 2px 10px; font-weight: bold; border-radius: 5px;
            font-size: 14px;
        }

        /* Controlli */
        .ui-panel {
            height: 30vh;
            background: #1a1a1a;
            padding: 20px;
            box-sizing: border-box;
        }

        button {
            background: white; color: black;
            border: none; padding: 15px 40px;
            border-radius: 50px; font-size: 18px; font-weight: bold;
            cursor: pointer; width: 80%;
        }

        #result-display {
            margin-top: 15px;
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <div class="viewfinder">
            <div id="step-label" class="label-overlay">1. NOME PRODOTTO</div>
        </div>
    </div>

    <div class="ui-panel">
        <button id="capture-btn">CATTURA NOME</button>
        <div id="result-display">Inquadra il nome del prodotto</div>
    </div>

    <canvas id="crop-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const resultDisplay = document.getElementById('result-display');
        const stepLabel = document.getElementById('step-label');
        const canvas = document.getElementById('crop-canvas');

        let currentStep = 'name'; // Può essere 'name' o 'date'
        let productData = { name: '', date: '' };

        // 1. Avvia la fotocamera posteriore in diretta
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: false 
        }).then(stream => {
            video.srcObject = stream;
        }).catch(err => {
            resultDisplay.innerText = "Errore fotocamera: " + err;
        });

        // 2. Logica al click del pulsante
        captureBtn.addEventListener('click', async () => {
            resultDisplay.innerText = "Analisi in corso...";
            
            // Ritagliamo l'area del mirino
            const ctx = canvas.getContext('2d');
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            
            // Calcolo proporzioni mirino rispetto al video
            const cropW = vWidth * 0.8;
            const cropH = vHeight * 0.25;
            const startX = (vWidth - cropW) / 2;
            const startY = (vHeight - cropH) / 2;

            canvas.width = cropW;
            canvas.height = cropH;
            ctx.drawImage(video, startX, startY, cropW, cropH, 0, 0, cropW, cropH);

            try {
                const result = await Tesseract.recognize(canvas, 'ita');
                const text = result.data.text.trim();

                if (currentStep === 'name') {
                    productData.name = text || "Sconosciuto";
                    // Passiamo al secondo step
                    currentStep = 'date';
                    stepLabel.innerText = "2. DATA DI SCADENZA";
                    stepLabel.style.background = "#ff3b30";
                    document.querySelector('.viewfinder').style.borderColor = "#ff3b30";
                    captureBtn.innerText = "CATTURA DATA";
                    captureBtn.style.background = "#ff3b30";
                    captureBtn.style.color = "white";
                    resultDisplay.innerHTML = `Prodotto: <b>${productData.name}</b><br>Ora inquadra la data.`;
                } else {
                    // Cerca la data con la RegEx potenziata
                    const datePattern = /\b(\d{1,2})([./-])(\d{1,2})\2(\d{2,4})\b/;
                    const foundDate = text.match(datePattern);

                    if (foundDate) {
                        productData.date = foundDate[0];
                        resultDisplay.innerHTML = `✅ SALVATO!<br>Prodotto: ${productData.name}<br>Scade: ${productData.date}`;
                        // Qui potremmo resettare o salvare nel database
                        resetFlow();
                    } else {
                        resultDisplay.innerHTML = `❌ Data non letta bene.<br>Testo letto: "${text}"<br>Riprova!`;
                    }
                }
            } catch (e) {
                resultDisplay.innerText = "Errore OCR.";
            }
        });

        function resetFlow() {
            setTimeout(() => {
                currentStep = 'name';
                stepLabel.innerText = "1. NOME PRODOTTO";
                stepLabel.style.background = "#00ff00";
                document.querySelector('.viewfinder').style.borderColor = "#00ff00";
                captureBtn.innerText = "CATTURA NOME";
                captureBtn.style.background = "white";
                captureBtn.style.color = "black";
                resultDisplay.innerText = "Inquadra il prossimo prodotto";
            }, 5000);
        }
    </script>
</body>
</html>

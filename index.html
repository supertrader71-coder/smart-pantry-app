<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - Scadenza Cibi</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .camera-box { border: 2px dashed #007bff; padding: 20px; border-radius: 15px; background: white; }
        #output { margin-top: 20px; padding: 10px; background: #e2e2e2; min-height: 50px; border-radius: 10px; }
        button { background: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; }
        img { max-width: 100%; margin-top: 10px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

    <h1>🍎 Smart Pantry</h1>
    <p>Inquadra il nome o la data di scadenza</p>

    <div class="camera-box">
        <input type="file" accept="image/*" capture="environment" id="file-input" style="display: none;">
        <button onclick="document.getElementById('file-input').click()">📸 Scatta Foto</button>
        
        <img id="preview" alt="Anteprima">
        <div id="output">Il testo apparirà qui...</div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const output = document.getElementById('output');
        const preview = document.getElementById('preview');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Mostra anteprima immagine
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            output.innerText = "Analisi in corso... attendi...";

            // Avvia l'OCR (Tesseract.js)
            Tesseract.recognize(
                file,
                'ita', // Lingua italiana
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                // Pulizia minima del testo (RegEx per trovare date)
                const datePattern = /\d{2}[\/\-]\d{2}[\/\-]\d{2,4}/;
                const foundDate = text.match(datePattern);
                
                output.innerHTML = `
                    <strong>Testo rilevato:</strong> <br>${text}<br><br>
                    <strong>Data trovata:</strong> ${foundDate ? foundDate[0] : "Non trovata"}
                `;
            }).catch(err => {
                output.innerText = "Errore durante la lettura.";
                console.error(err);
            });
        });
    </script>
</body>
</html>
